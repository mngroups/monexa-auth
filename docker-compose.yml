# Local dependencies for `pnpm dev`. The service itself runs on the host (pnpm dev).
services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: monexa
      POSTGRES_PASSWORD: monexa
      POSTGRES_DB: monexa
    ports: ["5432:5432"]
    volumes: [postgres-data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U monexa"]
      interval: 5s
      retries: 10

volumes:
  postgres-data:
